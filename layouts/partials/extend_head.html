{{- /* Custom CSS for heading fonts */ -}}
<style>
    /* Customize heading fonts */
    h1, h2, h3, h4, h5, h6 {
        /* Change the font family for all headings */
        /* font-family: 'Georgia', 'Times New Roman', serif; */

        /* Or use a system font stack */
        /* font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; */

        /* Or use a Google Font (add the link tag below) */
        font-family: "Funnel Display", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-style: normal;
    }

    /* Individual heading customization */
    h1 {
        font-size: 2.5rem;
        font-weight: 650;
        line-height: 1.2;
    }

    h2 {
        font-size: 2rem;
        font-weight: 450;
        line-height: 1.3;
    }

    h3 {
        font-size: 1.5rem;
        font-weight: 400;
        line-height: 1.4;
    }

    /* Customize paragraph fonts */
    p, body, li, td, th {
        font-family: "Funnel Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 350;
        font-style: normal;
    }

    /* Override body font-size */
    body {
        font-size: 17px;
    }
    
    /* Reset margin-top for list items in post content */
    .post-content li {
        margin-top: initial;
    }
</style>

{{- /* Mermaid.js support for diagrams */ -}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
    // Initialize mermaid with a specific theme
    // Color Theme: https://www.color-hex.com/color-palette/2922
    mermaid.initialize({
        startOnLoad: true,
        theme: 'base',               // ‘base’ honors custom vars best
        themeVariables: {
            /* canvas */
            background: '#ffffff',

            /* default node surface */
            mainBkg: '#ffffff',
            textColor: '#212121',    // 12.6:1 against white

            /* primary grouping – pastel green */
            primaryColor: '#dcedc1',  // 220-237-193
            primaryBorderColor: '#8bc34a',  // 600-level green for definition
            primaryTextColor: '#212121',  // 13.0:1 contrast

            /* secondary grouping – peach */
            secondaryColor: '#ffd3b6',
            secondaryBorderColor: '#fb8c00',
            secondaryTextColor: '#212121',  // 11.7:1

            /* tertiary grouping – salmon */
            tertiaryColor: '#ffaaa5',
            tertiaryBorderColor: '#e53935',
            tertiaryTextColor: '#212121',  // 8.9:1

            /* accent / highlight – pink */
            highlightColor: '#ff8b94',
            highlightBorderColor: '#c2185b',
            highlightTextColor: '#212121',  // 7.2:1

            /* sub-graph background – mint */
            clusterBkg: '#a8e6cf',
            clusterBorder: '#009688',

            /* Timeline color scale — first 6 slots cover M1-M6 */
            cScale0: '#dcedc1', cScaleLabel0: '#212121',   // M1  – pastel green
            cScale1: '#ffe0b2', cScaleLabel1: '#212121',   // M2  – pastel peach
            cScale2: '#ffcdd2', cScaleLabel2: '#212121',   // M3  – pastel coral
            cScale3: '#d1c4e9', cScaleLabel3: '#212121',   // M4  – pastel lavender  ← NEW
            cScale4: '#b2ebf2', cScaleLabel4: '#212121',   // M5  – pastel teal
            cScale5: '#fff9c4', cScaleLabel5: '#212121',   // M6  – pastel yellow

            /* Shared stroke / text */
            lineColor: '#455a64',       // axis & connector lines
            textColor: '#212121',       // default text (WCAG-AA safe)
            fontFamily: 'Funnel Sans, Inter, Roboto, "Helvetica Neue", Arial, sans-serif'
        }
    });

    // Handle dynamic content and re-render mermaid diagrams
    document.addEventListener('DOMContentLoaded', function() {
        // Find all code blocks with language-mermaid class
        document.querySelectorAll('pre code.language-mermaid').forEach(function(element) {
            // Get the mermaid code
            const mermaidCode = element.textContent;

            // Create a new div for the diagram
            const mermaidDiv = document.createElement('div');
            mermaidDiv.className = 'mermaid';
            mermaidDiv.textContent = mermaidCode;

            // Replace the pre element with the mermaid div
            const preElement = element.parentElement;
            preElement.parentElement.replaceChild(mermaidDiv, preElement);
        });

        // Re-initialize mermaid to render the new divs
        mermaid.init();
    });
</script>
