baseURL: 'https://keolo.com'
languageCode: 'en-us'
title: 'Keolo'

# Code highlighting
# https://swapoff.org/chroma/playground/
markup:
  highlight:
    lineNos: true
    noClasses: false
    style: 'monokailight'
  goldmark:
    renderer:
      unsafe: true # Allow raw HTML in markdown files

# Suppress specific warnings
ignoreErrors:
  - error-deprecated-socials

# Suppress warnings about raw HTML
ignoreLogs:
  - 'warning-goldmark-raw-html'
  - 'warning-partial-superfluous-prefix'

# PaperMod theme configuration
theme: 'PaperMod'
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 25
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: book-call
      name: Book a Call
      url: "#"
      weight: 40
params: 
  mainSections: ["projects", "posts"]
  ShowCodeCopyButtons: true
  disableThemeToggle: true
  defaultTheme: "light"
  assets:
    disableScrollBarStyle: true
    # https://medium.com/web-dev-survey-from-kyoto/favicon-nightmare-how-to-maintain-sanity-7628bfc39918
    favicon: 'favicon.ico'
    favicon16x16: /assets/favicon-16x16.png
    favicon32x32: /assets/favicon-32x32.png
    apple_touch_icon: /assets/apple-touch-icon.png
  ShowShareButtons: true
  ShareButtons: ["linkedin", "x"]
  homeInfoParams:
    title: "Need fractional tech leadership?  Let’s talk."
    content: |
      I'm Keolo, **Partner & CTO** at <a href="https://aliveness.ventures" target="_blank" rel="noopener noreferrer">Aliveness Ventures</a> who turns ideas into **revenue-generating products**.

      +
      **20 yrs | 25 MVPs | 5 exited** across HealthTech, FinTech, AI/ML, and Enterprise/Consumer SaaS.
      **Scaled remote teams 0→30**, increased release velocity 4x, **SOC 2/HITRUST/HIPAA experienced**.

      +
      Superpowers:
      - • 🚀 **0→1 Delivery** — **25 MVPs** (3 < 90 days), Voice & AI/ML; OSS libs **4M+ downloads**
      - • 🌍 **Remote Scaling** — **0→30** team growth, attrition < 1%; 15+ startups Pre-seed→Series C
      - • 📈 **Strategic Impact** — **40% ARR lift** after 12-wk product-market-fit reset
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/keolo"
    - name: "github"
      url: "https://github.com/keolo"
    # - name: "youtube"
    #   url: "https://www.youtube.com/ke0l0"
  showtoc: true
  tocopen: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  # cover:
  #   linkFullImages: true
  #   responsiveImages: true
  #   hidden: false

# Define social as a taxonomy to replace deprecated .Site.Social
taxonomies:
  social: "socials"
