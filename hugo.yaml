baseURL: "https://keolo.com"
locale: "en-us"
title: "Keolo"

# Code highlighting
# https://swapoff.org/chroma/playground/
markup:
  highlight:
    lineNos: true
    noClasses: false
    style: "monokailight"
  goldmark:
    renderer:
      unsafe: true # Allow raw HTML in markdown files

# Suppress specific warnings
ignoreErrors:
  - error-deprecated-socials

# Suppress warnings about raw HTML
ignoreLogs:
  - "warning-goldmark-raw-html"
  - "warning-partial-superfluous-prefix"

# PaperMod theme configuration
theme: "PaperMod"
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 40
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 50
    - identifier: book-call
      name: Book a Call
      url: "#"
      weight: 60
params:
  mainSections: ["projects", "posts"]
  ShowCodeCopyButtons: true
  disableThemeToggle: true
  defaultTheme: "light"
  label:
    icon: "/k-mark.svg"
  assets:
    disableScrollBarStyle: true
    # https://medium.com/web-dev-survey-from-kyoto/favicon-nightmare-how-to-maintain-sanity-7628bfc39918
    favicon: "favicon.ico"
    favicon16x16: /assets/favicon-16x16.png
    favicon32x32: /assets/favicon-32x32.png
    apple_touch_icon: /assets/apple-touch-icon.png
  ShowShareButtons: true
  ShareButtons: ["linkedin", "x"]
  homeInfoParams:
    title: "Tech leadership for high-stakes startups"
    content: |
      I'm Keolo, **Partner & CTO** at <a href="https://aliveness.ventures" target="_blank" rel="noopener noreferrer">Aliveness Ventures</a> turning ideas into **revenue-generating products**.

      +
      **Fractional CTO | AI, HealthTech & FinTech | 25+ MVPs**

      **Over two decades of startup experience**, increased release velocity 4x, **SOC 2/HIPAA/HITRUST**.

      +
      - ✦ 🚀 **0→1 Delivery** — **25+ MVPs** (3 < 90 days), **Agentic Systems**; OSS libs **4M+ downloads**
      - ✦ 🌍 **Remote Scaling** — **0→30 team growth**, attrition < 1%; 15+ startups Pre-seed→Series C
      - ✦ 📈 **Strategic Impact** — Built the technology behind **5 startup exits**—and counting
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/keolo"
    - name: "github"
      url: "https://github.com/keolo"
    # - name: "youtube"
    #   url: "https://www.youtube.com/ke0l0"
  showtoc: true
  tocopen: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  # cover:
  #   linkFullImages: true
  #   responsiveImages: true
  #   hidden: false

# Define social as a taxonomy to replace deprecated .Site.Social
taxonomies:
  social: "socials"

# Sitemap configuration for better SEO
sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"
