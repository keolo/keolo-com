baseURL: 'https://keolo.com'
languageCode: 'en-us'
title: 'Keolo'

# Code highlighting
# https://swapoff.org/chroma/playground/
markup:
  highlight:
    lineNos: true
    noClasses: false
    style: 'monokailight'
  goldmark:
    renderer:
      unsafe: true # Allow raw HTML in markdown files

# Suppress specific warnings
ignoreErrors:
  - error-deprecated-socials

# Suppress warnings about raw HTML
ignoreLogs:
  - 'warning-goldmark-raw-html'
  - 'warning-partial-superfluous-prefix'

# PaperMod theme configuration
theme: 'PaperMod'
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 25
    # - identifier: about
    #   name: About
    #   url: /about/
    #   weight: 30
    - identifier: book-call
      name: Book a Call
      url: "#"
      weight: 40
params: 
  mainSections: ["projects", "posts"]
  ShowCodeCopyButtons: true
  disableThemeToggle: true
  defaultTheme: "light"
  assets:
    disableScrollBarStyle: true
    # https://medium.com/web-dev-survey-from-kyoto/favicon-nightmare-how-to-maintain-sanity-7628bfc39918
    favicon: 'favicon.ico'
    favicon16x16: /assets/favicon-16x16.png
    favicon32x32: /assets/favicon-32x32.png
    apple_touch_icon: /assets/apple-touch-icon.png
  ShowShareButtons: true
  ShareButtons: ["linkedin", "x"]
  homeInfoParams:
    title: "Hi there \U0001F44B"
    content: |
      I'm Keolo, a hands-on **technology leader** who turns whiteboard ideas into compliant, 
      revenue-producing products. **20+ yrs** across HealthTech, FinTech, AI/ML, Consumer SaaS; 
      repeatedly scaled **15+ startups**; contributed as IC/Manager in **5 exits**.

      +
      - • 🚀 **0→1 Delivery** — **35 MVPs** (3 < 90 days), Voice & AI/ML; OSS libs **4M+ installs**
      - • 🌍 **Remote Scaling** — Teams **0→30**, attrition < 5%; 15+ startups Pre-seed→Series C
      - • 🛡️ **Compliance-First** — **SOC 2, HIPAA, HITRUST passed 1st audit;** Go/Python/GCP/Flutter
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/keolo"
    - name: "github"
      url: "https://github.com/keolo"
    # - name: "youtube"
    #   url: "https://www.youtube.com/ke0l0"
  showtoc: true
  tocopen: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  # cover:
  #   linkFullImages: true
  #   responsiveImages: true
  #   hidden: false

# Define social as a taxonomy to replace deprecated .Site.Social
taxonomies:
  social: "socials"
