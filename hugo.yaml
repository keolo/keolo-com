baseURL: 'https://keolo.co'
languageCode: 'en-us'
title: 'Keolo'

# Code highlighting
# https://swapoff.org/chroma/playground/
markup:
  highlight:
    lineNos: true
    noClasses: false
    style: 'monokailight'
  goldmark:
    renderer:
      unsafe: true # Allow raw HTML in markdown files

# Suppress specific warnings
ignoreErrors:
  - error-deprecated-socials

# Suppress warnings about raw HTML
ignoreLogs:
  - 'warning-goldmark-raw-html'

# PaperMod theme configuration
theme: 'PaperMod'
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: tutorials
      name: Tutorials
      url: /tutorials/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    # - identifier: about
    #   name: About
    #   url: /about/
    #   weight: 30
params: 
  mainSections: ["posts", "tutorials"]
  ShowCodeCopyButtons: true
  disableThemeToggle: true
  defaultTheme: "light"
  assets:
    disableScrollBarStyle: true
    # https://medium.com/web-dev-survey-from-kyoto/favicon-nightmare-how-to-maintain-sanity-7628bfc39918
    favicon: 'favicon.ico'
    favicon16x16: /assets/favicon-16x16.png
    favicon32x32: /assets/favicon-32x32.png
    apple_touch_icon: /assets/apple-touch-icon.png
  ShowShareButtons: true
  ShareButtons: ["linkedin", "x"]
  homeInfoParams:
    title: "Hi there \U0001F44B"
    content: |
      I'm Keolo, I offer insights into 
      startups, software engineering, and management from my experience leading 
      teams and driving innovation. Whether you're a founder, engineer, or 
      leader, you'll find actionable knowledge to fuel your growth and success. Let's 
      go!

      +
      - • 🚀 15+ startups, 5 exits — as engineer, manager, and Fractional CTO
      - • 🧠 Built voice+AI products before it was cool (pre-ChatGPT hype)
      - • 📈 Scaled teams and tech through multiple funding rounds
      - • 📦 Open source author with 4M+ downloads
      - • 👨‍💻 Go, Python, Flutter, GCP — battle-tested in startup, mid-market, and enterprise environments
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/keolo"
    - name: "github"
      url: "https://github.com/keolo"
    # - name: "youtube"
    #   url: "https://www.youtube.com/ke0l0"
  showtoc: true
  tocopen: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  # cover:
  #   linkFullImages: true
  #   responsiveImages: true
  #   hidden: false

# Define social as a taxonomy to replace deprecated .Site.Social
taxonomies:
  social: "socials"
