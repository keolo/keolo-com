baseURL: 'https://keolo.gitlab.io'
languageCode: 'en-us'
title: 'Keolo'

# Code highlighting
# https://swapoff.org/chroma/playground/
markup:
  highlight:
    lineNos: true
    noClasses: false
    style: 'monokailight'

# PaperMod theme configuration
theme: 'PaperMod'
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
params: 
  ShowCodeCopyButtons: true
  disableThemeToggle: true
  defaultTheme: "light"
  assets:
    disableScrollBarStyle: true
    # https://medium.com/web-dev-survey-from-kyoto/favicon-nightmare-how-to-maintain-sanity-7628bfc39918
    favicon: 'favicon.ico'
    favicon16x16: /assets/favicon-16x16.png
    favicon32x32: /assets/favicon-32x32.png
    apple_touch_icon: /assets/apple-touch-icon.png
  ShowShareButtons: true
  ShareButtons: ["linkedin", "x"]
  homeInfoParams:
    title: "Hi there \U0001F44B"
    content: |
      I'm Keolo, a Startup Engineering Leader. I offer insights on growing 
      startups, software engineering, and management from my experience leading 
      teams and driving innovation. Whether you're a founder, developer, or 
      leader, you'll find valuable tips to fuel your growth and success. Let's 
      go!

      +
      - • 🚀 15+ startups, 5 exits/contributions as an IC
      - • 🦾 20+ years of startup, mid-market, and enterprise experience
      - • 🙌 3.6M+ downloads of open source library
      - • 👨‍🚀 Founder, Fractional CTO, Head of Engineering, Engineering Manager, Founding Engineer
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/keolo"
    - name: "github"
      url: "https://github.com/keolo"
    - name: "youtube"
      url: "https://www.youtube.com/ke0l0"
  showtoc: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  # cover:
  #   linkFullImages: true
  #   responsiveImages: true
  #   hidden: false
